name: Build Miauberto Player Bundle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission and build AAB
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "No se encontró el archivo gradlew en el repositorio"
          exit 1
        fi
        echo "Gradlew encontrado en: $GRADLEW_PATH"
        chmod +x "$GRADLEW_PATH"
        DIR_PATH=$(dirname "$GRADLEW_PATH")
        cd "$DIR_PATH"
        ./gradlew assembleDebug bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiaubertoPlayer-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"

    - name: Upload AAB Bundle Artifact (Google Play)
      uses: actions/upload-artifact@v4
      with:
        name: MiaubertoPlayer-AAB-Release
        path: "**/app/build/outputs/bundle/release/app-release.aab"
