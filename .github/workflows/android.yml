name: Build Miauberto Player Bundle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK and AAB Bundle
      run: ./gradlew assembleDebug bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiaubertoPlayer-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AAB Bundle Artifact (Google Play)
      uses: actions/upload-artifact@v4
      with:
        name: MiaubertoPlayer-AAB-Release
        path: app/build/outputs/bundle/release/app-release.aab
